name: Siteyi yayınla

# Her kayıttan (push) sonra siteyi derler ve hazır siteyi "yayin" dalına koyar.
# Natro hosting'deki zamanlanmış görev bu dalı birkaç dakikada bir
# public_html/deneme klasörüne çeker. Şifre gerekmez.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Hazır siteyi yayin dalına koy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: yayin
          publish_dir: ./dist/deneme
          force_orphan: true
          enable_jekyll: true
          commit_message: "Site derlendi"
