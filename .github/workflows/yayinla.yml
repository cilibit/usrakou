name: Siteyi yayınla

# Her kayıttan (push) sonra siteyi derler ve Natro hosting'e FTP ile yükler.
# Gerekli depo sırları (Settings → Secrets and variables → Actions):
#   FTP_USERNAME : Natro hosting FTP kullanıcı adı (cPanel kullanıcı adı)
#   FTP_PASSWORD : FTP şifresi (Natro → Ftp Şifre Değiştirme Merkezi)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Hosting'e yükle (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: cpls56.srvpanel.com
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/deneme/
          server-dir: public_html/deneme/
